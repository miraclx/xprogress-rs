[package]
name = "xprogress"
version = "0.1.0"
authors = ["Miraculous Owonubi <omiraculous@gmail.com>"]
edition = "2024"
rust-version = "1.85"
description = "Segmented single-line progress bars: several independent progresses composited onto one terminal line, with confirmed-versus-buffered shading"
repository = "https://github.com/miraclx/xprogress-rs"
license = "MIT OR Apache-2.0"
keywords = ["progress", "progressbar", "cli", "terminal", "bytes"]
categories = ["command-line-interface"]

[dependencies]
unicode-width = "0.2"

[lints.rust]
unused_must_use = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
wildcard_imports = "deny"
std_instead_of_core = "warn"
alloc_instead_of_core = "warn"
